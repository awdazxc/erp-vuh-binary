name: Install VUH
description: Install VUH globally using official installer

inputs:
  version:
    description: "VUH version(example: v1.2.3)"
    required: false
    default: "main"

runs:
  using: composite
  steps:
    - name: Download installer and components
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"

        echo "Downloading VUH from tag/branch/commit: $VERSION"

        curl -L -o installer.sh \
          "https://raw.githubusercontent.com/Greewil/version-update-helper/${VERSION}/installer.sh"

        curl -L -o vuh.sh \
          "https://raw.githubusercontent.com/Greewil/version-update-helper/${VERSION}/vuh.sh"

        curl -L -o vuh-completion.sh \
          "https://raw.githubusercontent.com/Greewil/version-update-helper/${VERSION}/vuh-completion.sh"

        chmod +x installer.sh
        chmod +x vuh.sh

    - name: Install VUH
      shell: bash
      run: sudo ./installer.sh -d || true

    - name: Verify VUH installation
      shell: bash
      run: |
        echo "Checking VUH installation..."
        which vuh || { echo "vuh not found in PATH"; exit 1; }
        vuh -v
