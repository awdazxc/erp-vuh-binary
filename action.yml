name: Install VUH
description: Install VUH from GitHub release archives

inputs:
  version:
    description: "VUH release tag (example: v2.12). If empty — latest release will be installed."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Determine version
      id: resolve_version
      shell: bash
      run: |
        if [ -z "${{ inputs.version }}" ]; then
          echo "No version provided. Fetching latest release..."
          LATEST=$(curl -s https://api.github.com/repos/Greewil/version-update-helper/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
        else
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Detect OS
      id: detect_os
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          echo "archive=vuh-linux.tar.gz" >> $GITHUB_OUTPUT
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "archive=vuh-macos.tar.gz" >> $GITHUB_OUTPUT
        else
          echo "archive=vuh-windows.zip" >> $GITHUB_OUTPUT
        fi

    - name: Download archive
      shell: bash
      run: |
        VERSION="${{ steps.resolve_version.outputs.version }}"
        ARCHIVE="${{ steps.detect_os.outputs.archive }}"

        echo "Installing VUH version: $VERSION"
        echo "Downloading archive: $ARCHIVE"

        curl -f -L -o vuh-archive \
          "https://github.com/Greewil/version-update-helper/releases/download/${VERSION}/${ARCHIVE}"

    - name: Extract and install
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          unzip vuh-archive
          mv vuh.exe /usr/local/bin/vuh.exe
        else
          tar -xzf vuh-archive
          chmod +x vuh
          sudo mv vuh /usr/local/bin/vuh
        fi

    - name: Verify installation
      shell: bash
      run: |
        echo "Checking VUH installation..."
        which vuh || { echo "vuh not found in PATH"; exit 1; }
        vuh -v
