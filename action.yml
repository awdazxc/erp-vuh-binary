name: Install VUH
description: Install VUH globally using installer.sh

runs:
  using: composite
  steps:
    - name: Download installer
      shell: bash
      run: |
        curl -L -o installer.sh \
          https://raw.githubusercontent.com/Greewil/version-update-helper/main/installer.sh
        chmod +x installer.sh

    - name: Install VUH
      shell: bash
      run: |
        sudo ./installer.sh -d
