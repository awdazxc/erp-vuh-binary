name: Install VUH
description: Install VUH from GitHub release binary

inputs:
  version:
    description: "VUH release tag (example: v2.12). If empty — latest release will be installed."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Determine version
      id: resolve_version
      shell: bash
      run: |
        if [ -z "${{ inputs.version }}" ]; then
          echo "No version provided. Fetching latest release..."
          LATEST=$(curl -s https://api.github.com/repos/Greewil/version-update-helper/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
        else
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Download VUH binary
      shell: bash
      run: |
        VERSION="${{ steps.resolve_version.outputs.version }}"
        echo "Installing VUH version: $VERSION"

        curl -f -L -o vuh \
          "https://github.com/Greewil/version-update-helper/releases/download/${VERSION}/vuh-linux"

        chmod +x vuh
        sudo mv vuh /usr/local/bin/vuh

    - name: Verify VUH installation
      shell: bash
      run: |
        echo "Checking VUH installation..."
        which vuh || { echo "vuh not found in PATH"; exit 1; }
        vuh -v
